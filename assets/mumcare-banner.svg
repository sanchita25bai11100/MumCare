<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C1D95"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="heart" x1="900" y1="90" x2="1060" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBCFE8"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="glow" x="850" y="40" width="280" height="280" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="30" fill="url(#background)"/>

  <!-- Ambient glow -->
  <circle cx="1000" cy="170" r="105" fill="#F9A8D4" opacity="0.18" filter="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="1070" cy="70" r="70" fill="white" opacity="0.06"/>
  <circle cx="1120" cy="280" r="100" fill="white" opacity="0.05"/>
  <circle cx="850" cy="40" r="35" fill="white" opacity="0.06"/>

  <!-- Heart -->
  <path
    d="M1000 255
       C970 232 895 188 895 132
       C895 92 928 70 961 70
       C981 70 995 81 1000 96
       C1005 81 1019 70 1039 70
       C1072 70 1105 92 1105 132
       C1105 188 1030 232 1000 255Z"
    fill="url(#heart)"
    opacity="0.96"/>

  <!-- Neural nodes -->
  <g stroke="#E9D5FF" stroke-width="2" opacity="0.45">
    <line x1="820" y1="100" x2="900" y2="135"/>
    <line x1="820" y1="220" x2="900" y2="170"/>
    <line x1="1100" y1="130" x2="1150" y2="100"/>
    <line x1="1100" y1="200" x2="1150" y2="250"/>
  </g>

  <g fill="#F5D0FE">
    <circle cx="820" cy="100" r="7"/>
    <circle cx="820" cy="220" r="7"/>
    <circle cx="900" cy="135" r="7"/>
    <circle cx="900" cy="170" r="7"/>
    <circle cx="1100" cy="130" r="7"/>
    <circle cx="1100" cy="200" r="7"/>
    <circle cx="1150" cy="100" r="6"/>
    <circle cx="1150" cy="250" r="6"/>
  </g>

  <!-- Main title -->
  <text
    x="75"
    y="135"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="72"
    font-weight="700">
    MumCare
  </text>

  <!-- Subtitle -->
  <text
    x="80"
    y="185"
    fill="#FCE7F3"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="400">
    Maternal Care Intelligence Platform
  </text>

  <!-- Tagline -->
  <text
    x="82"
    y="230"
    fill="#E9D5FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    letter-spacing="2">
    SUPPORT  •  UNDERSTAND  •  GUIDE  •  CONNECT
  </text>

  <!-- Accent -->
  <rect x="82" y="265" width="330" height="4" rx="2" fill="#FBCFE8"/>

  <!-- Small label -->
  <text
    x="82"
    y="305"
    fill="#DDD6FE"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15">
    AI-ASSISTED • HUMAN-IN-THE-LOOP • SAFETY-FIRST
  </text>
</svg>
